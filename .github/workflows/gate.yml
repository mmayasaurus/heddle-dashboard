# Gate — the required merge check for heddle-dashboard (Tauri v2 / Rust + React).
#
# What it proves: the frontend compiles (`tsc` + `vite build`), 170 vitest tests
# pass (`pnpm test`), `cargo check` succeeds for both feature sets (default
# `gui` and `--no-default-features` minimal vela-server), and `cargo test`
# passes on Linux (353 tests; 8 ignored by design — they need real ~/.claude /
# SSH state). That real work lives in the `web` / `rust` / `rust-test` jobs; the
# `gate` job aggregates their results.
#
# What it does NOT prove: eslint is non-required and red until HED-14 (`lint`
# job — deliberately outside the aggregator). No packaged `tauri build`,
# nothing runs the app, no clippy/fmt.
#
# Runs on GitHub-hosted runners — the repo is public, so minutes are free. The
# job NAME `gate` is the required-status-check context string for the "Protect
# main" ruleset (HED-13); renaming it silently un-requires the gate. The marker
# name `gate-verdict` is NOT required and must stay out of the ruleset (see below).
#
# ── EDIT-SAFE via a verdict echo (HED-142) ──────────────────────────────────
# GitHub resolves a required status check from the newest check-run of the
# required name in the newest check-SUITE on the head commit (suite order, not
# run completion order — measured live on dashboard#45). A PR `edited` event
# (reviewer bots edit the body constantly) re-fires this workflow with NO new
# commit, in a NEW suite. Three earlier
# fixes each died on a GitHub semantic we had inferred rather than observed; all
# six behaviours are now reproduced in a sandbox and written up in docs/CI.md:
#   • skip the edit run  → it publishes a `skipped` check-run, and `skipped`
#     SUPERSEDES a real red → a body-edit MASKS a failure. Unsafe.
#   • dynamic job name   → edits publish a DIFFERENT context, so the latest suite
#     no longer carries `gate` → the required check reads unsatisfied → the PR is
#     BLOCKED with no code cause. Unsafe (this is what attempt 3 did).
#   • re-run real work on edits in a shared slot → a bot edit CANCELS the
#     in-flight run; here doubly costly (the rust jobs restart cold) and the
#     always() aggregator sees cancelled needs and publishes `gate: FAILURE`
#     with no code cause (measured live on dashboard#41, run 32068437179).
# The echo satisfies all three at once. Every run — commit or edit — publishes
# the STATIC context `gate`. A commit / retarget / push run does the real work
# (web/rust/rust-test), and the `gate` aggregator records its verdict as a
# non-required `gate-verdict` marker check-run on the head SHA. An edit run does
# NOT recompute (the expensive rust jobs are skipped): it reads that SHA's latest
# `gate-verdict` and republishes exactly that conclusion. So an edit can only
# ever REPEAT the real verdict for the exact commit under review — green stays
# green, red stays red (no mask) — and `gate` is present on every suite (no
# block). Edit runs normally take seconds (they just read the marker); one that
# races an in-flight commit build stays PENDING, waiting for that build's
# verdict, rather than failing closed into a newer suite. They get their own
# concurrency slot with cancel-in-progress: false, so they never cancel anything
# (no cancellation-red).
# On a reopened PR the head SHA is unchanged and `reopened` is a commit-path
# event, so it simply re-runs the real jobs and refreshes the marker — verdicts
# are SHA-bound, so reopen carries no stale-verdict hazard.
#
# Hardening (zizmor-clean): every action hash-pinned (Dependabot bumps the pins,
# see .github/dependabot.yml), workflow-level `permissions: {}`, checkout without
# persisted credentials (build steps never see a token), runner pinned to an
# Ubuntu series (not `-latest`) so the environment only moves when we move it.
# The `gate` job alone holds `checks: write` — the least privilege the marker
# read/write needs; every leaf job stays `contents: read`.
name: Gate

on:
  push:
    branches: [main]
  pull_request:
    # NO base-branch filter, and `edited` included — both halves of HED-91,
    # found live on heddle#9:
    #   * `branches: [main]` meant a STACKED PR (base = another agent's branch)
    #     never ran this workflow at all. The required check `gate` was then
    #     permanently absent, so the PR could not satisfy the ruleset — an
    #     unrunnable gate, not a failing one.
    #   * RETARGETING a PR's base (the normal move once the parent merges) fires
    #     ONLY `pull_request: edited` — no synchronize, no new commit. Without
    #     `edited` the retargeted PR silently kept the verdict it earned against
    #     the OLD base, which is a different merge result.
    # `edited` also fires on title/body edits (reviewer bots edit bodies often).
    # Those take the echo path below — see the `gate` job — so they neither skip
    # nor recompute; they republish the head SHA's real verdict.
    types: [opened, synchronize, reopened, edited]
  # Break-glass manual run, e.g. to re-check main after a runner-side outage.
  workflow_dispatch: {}

permissions: {}

# TWO SLOTS (HED-91/142). Commit-driven events (push, opened, synchronize,
# reopened) and a base RETARGET (an `edited` whose changes.base.ref.from is
# populated) share the `run` slot with cancel-in-progress: TRUE — a newer commit
# supersedes the stale run (and here spares a cold rust rebuild). Title/body
# `edited` events take the `edit` slot with cancel-in-progress: FALSE — echoes
# are ~5s and must never be cancelled, or a cancelled edit run could red the
# required context (the failure measured on dashboard#41). Because the slots
# differ, a body-edit's echo NEVER cancels an in-flight commit run (and vice
# versa); the echo just polls for that run's marker. The discriminator is
# github.event.changes.base.ref.from: populated on a retarget, empty/absent on a
# title or body edit (GitHub coerces the absent value so `!= ''` is false for a
# plain edit — verified in the sandbox).
concurrency:
  group: gate-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'run' || 'edit' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}

# Every leaf job runs on commit-driven events only; a title/body edit SKIPS them
# and the `gate` job echoes the head SHA's last real verdict instead of
# re-running (crucially, this avoids a cold rust rebuild on every bot body-edit).
# Each leaf repeats the same commit-event `if:` guard literally — no YAML anchor,
# to keep the file to constructs validated in the HED-142 sandbox.
jobs:
  web:
    name: web (pnpm build + vitest)
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json `packageManager: pnpm@11.5.2`;
      # pnpm/action-setup does NOT support pnpm 11 — pnpm/setup is the official
      # v11+ action.
      - name: Setup pnpm + Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (tsc + vite)
        run: pnpm build

      - name: Test (vitest)
        run: pnpm test

  rust:
    name: rust (cargo check)
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tauri Linux deps + pnpm/Node + frontend build + rustup + cargo cache —
      # shared with `rust-test` (one place to maintain the dependency list).
      - name: Tauri + Rust setup
        uses: ./.github/actions/tauri-rust-setup

      - name: cargo check (default features = gui)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked

      # Both configurations are real build targets — the crate's Cargo.toml
      # documents `--no-default-features` for the minimal vela-server build.
      - name: cargo check (--no-default-features = minimal server)
        run: cargo check --manifest-path src-tauri/Cargo.toml --locked --no-default-features

  rust-test:
    name: rust (cargo test)
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Tauri + Rust setup
        uses: ./.github/actions/tauri-rust-setup

      # 353 pass / 8 ignored on macOS (Agent T, 2026-08-15) AND green on the
      # first Linux run of this workflow (7 min cold cache) — so it is in the
      # `gate` aggregator. The 8 ignored tests need real ~/.claude / SSH state
      # and stay ignored in CI by design. Runs in parallel with `rust`
      # (separate job) rather than serially after it: wall-clock over minutes.
      - name: cargo test
        run: cargo test --manifest-path src-tauri/Cargo.toml --locked

  lint:
    name: lint (eslint) — NON-required, red until HED-14
    if: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # pnpm version comes from package.json `packageManager: pnpm@11.5.2`;
      # pnpm/action-setup does NOT support pnpm 11 — pnpm/setup is the official
      # v11+ action.
      - name: Setup pnpm + Node
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          runtime: node@22
          cache: true
          install: false

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `pnpm lint` fails on main today with 2 errors in src/remote/ConnectionBanner.tsx
      # inherited byte-identical from upstream VelaTerm (HED-14); this job is
      # deliberately NOT in the aggregator's needs — flip it in when HED-14 lands.
      # Its red is honest, not hidden.
      - name: Lint (eslint)
        run: pnpm lint

  gate:
    # Required-check context string — do NOT rename (see header; HED-13).
    #
    # Commit / retarget / push: aggregate the real leaf jobs (all of `needs` must
    # be success), record that verdict as the `gate-verdict` marker for the head
    # SHA, and exit with it (this job's own conclusion is the required verdict).
    # Title/body edit: the leaf jobs were skipped, so echo the head SHA's last
    # `gate-verdict` instead of recomputing — that is what stops an edit from
    # masking a red or dropping the `gate` context, without a cold rust rebuild.
    # `if: always()` so a skipped/failed/cancelled dependency still yields a real
    # `gate` verdict here rather than a `skipped` required check (which GitHub
    # would treat as passing).
    name: gate
    needs: [web, rust, rust-test]
    if: always()
    runs-on: ubuntu-24.04
    # INVARIANT (HED-182), two rules that size this echo:
    #   (1) the loop's sleep-sum > longest leaf timeout (`rust` = 45) + a publish
    #       grace, so the echo can't run out of polls while a leaf legitimately
    #       runs;  seq 1 105 at the backoff cadence ≈ 48m50s > 45.
    #   (2) timeout-minutes > the loop's sleep-sum + an API/startup allowance, so a
    #       stuck echo exits CLEANLY via the loop's own fail-closed rather than as
    #       a `timed_out` red in a NEWER suite;  55 > 48m50s + ~3-4min of 105
    #       paginated API reads.  (50 left only ~70s of API headroom.)
    # Raise a leaf timeout and you must re-check BOTH rules.
    timeout-minutes: 55
    permissions:
      checks: write
    steps:
      - name: Verdict (commit) or echo (edit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          # PR head on PR events; the pushed commit on push / workflow_dispatch.
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          # True ONLY for a title/body edit (an `edited` event with no base
          # change). Everything else — push, opened, synchronize, reopened, a
          # base retarget, workflow_dispatch — is a commit-path run.
          IS_EDIT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' }}
          # Aggregate of the required leaf jobs; only read on the commit path.
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -eu
          if [ "$IS_EDIT" = "true" ]; then
            echo "edit event — echoing the last real verdict (gate-verdict marker) for $SHA"
            CONC=none; DRY=0; VERDICT=""
            # WAIT for this SHA's real verdict; do not fail closed on a wall-clock
            # timer. The rust jobs can run long (their timeout is 45 min). A
            # premature red would land in a check-suite NEWER than the commit run's
            # own gate, and GitHub resolves a required check from the newest SUITE,
            # so it would block the PR until another edit superseded it (measured
            # live on dashboard#45). Fail-closed is reached two ways, both leaving
            # VERDICT empty: the commit-path build is verifiably GONE (no leaf in
            # flight) with still no FRESH marker for a sustained dry window, OR the
            # loop exhausts its belt. The belt (seq 1 105 at the backoff cadence ≈
            # 48m50s) is sized ABOVE the longest leaf timeout (rust = 45) so it
            # cannot run out while a leaf legitimately runs; the job timeout (55) is
            # sized ABOVE the belt so a stuck echo exits cleanly via the loop, not
            # as a `timed_out` red. Poll fast for ~2 min, then back off to 30s to
            # spare the API rate limit on a long build.
            for i in $(seq 1 105); do
              # F4: a failed check-runs read leaves liveness UNKNOWN and retries —
              # NEVER coerce it to an empty `{}` (that jq-errors under `set -eu`
              # and reds the required gate on a single transient API blip, and it
              # also fakes "no leaf in flight", advancing the fail-closed proof).
              if ! CR=$(gh api "repos/$REPO/commits/$SHA/check-runs" --paginate --slurp 2>/dev/null); then
                echo "  could not read check runs for ${SHA}; build liveness is unknown — retrying"
                # A failed read breaks the "verifiably gone" streak: you cannot prove
                # the build is gone across an outage, so the sustained-dry proof must
                # restart — else a pre-outage DRY streak plus one post-outage
                # gone-read could hit the threshold and fail closed while the commit
                # gate is about to publish (codex P1). Fail-closed direction only.
                DRY=0
                if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
                continue
              fi
              # F3: --paginate --slurp yields a JSON ARRAY of pages; flatten every
              # page's check_runs with [.[].check_runs[]] so a SHA whose check-run
              # list spans >1 page (each edit echo adds a `gate` run to the SHA, and
              # the list is returned across suites — verified on heddle#57) can't
              # split the lookup across pages.
              # D1: emit the latest gate-verdict conclusion ONLY IF the marker is
              # newer than the newest EXECUTED (non-skipped) commit-path leaf on
              # this SHA — i.e. posted by the CURRENT run, not left over from a prior
              # same-SHA run (reopen / re-run). The `and .conclusion != "skipped"`
              # guard is LOAD-BEARING: on a title/body edit the leaf jobs are
              # if:-false and publish `skipped` check-runs whose started_at is the
              # EDIT run's time (NEWER than the marker) — counting them would read
              # every marker as stale and RED the required gate on every bot edit
              # (finding 1, live-confirmed on heddle#57). in_progress leaves keep a
              # null conclusion so they still count (the four-state waits on them).
              # A stale marker reads as "none", so a same-SHA recompute's fresh
              # verdict is never pre-empted by the old one. Residual: in the seconds
              # before a fresh re-run's leaves are visible in the API the old marker
              # can still read fresh — documented in docs/CI.md, same rarity as the
              # class this closes. ISO-8601-Z timestamps compare as strings INSIDE
              # jq (POSIX `test` has no portable string `>`, so it stays in jq).
              CONC=$(printf '%s\n' "$CR" | jq -r '
                [.[].check_runs[]] as $all
                | ([$all[] | select((.name | test("^(build|web|rust)")) and .conclusion != "skipped") | .started_at] | max) as $leaf
                | ([$all[] | select(.name == "gate-verdict")] | sort_by(.started_at) | last) as $m
                | if $m == null or $leaf == null then "none"
                  elif $m.started_at >= $leaf then ($m.conclusion // "none")
                  else "none" end')
              INFLIGHT=$(printf '%s\n' "$CR" | jq -r '[.[].check_runs[]] | [ .[] | select((.name|test("^(build|web|rust)")) and .status!="completed") ] | length')
              # F2 — four states over the FRESH marker: accept only when a fresh
              # marker exists and no leaf is in flight; any in-flight leaf resets
              # the dry proof (with or without a marker); only fresh-none +
              # no-inflight advances the fail-closed proof. D2: the accept-break is
              # the ONLY path that records a VERDICT, so a retained CONC can never
              # green the gate via loop exhaustion (see the case after the loop).
              if [ "$CONC" != "none" ] && [ "$INFLIGHT" = "0" ]; then
                VERDICT="$CONC"; break
              fi
              if [ "$CONC" = "none" ] && [ "$INFLIGHT" = "0" ]; then
                DRY=$((DRY + 1))
              else
                DRY=0
              fi
              # Fail closed only when the build is verifiably gone AND still no
              # FRESH marker, sustained a few polls past the 90s grace — this
              # bridges the brief gap between the leaf jobs finishing and the commit
              # gate publishing the marker.
              if [ "$i" -gt 9 ] && [ "$DRY" -ge 6 ]; then
                echo "  build is no longer in flight and no fresh gate-verdict marker appeared — the commit gate did not publish (cancelled / never ran)."
                break
              fi
              if [ -z "${WAITED:-}" ]; then
                WAITED=1
                {
                  echo "### gate — waiting for the commit-path verdict on \`${SHA}\`"
                  echo "This edit run is holding the required \`gate\` **pending** until the commit-path build for this commit publishes its \`gate-verdict\`, which the echo then reflects. Pending here means *blocked-while-building*, not failed."
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "  waiting for the commit run's verdict on ${SHA} (poll ${i}; fresh marker=${CONC}, commit-path jobs in flight=${INFLIGHT}, dry=${DRY})"
              if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
            done
            # D2: exit 0 is reachable ONLY via the accept-break above (a poll that
            # saw a FRESH marker with no leaf in flight → VERDICT set). Loop
            # exhaustion, the DRY fail-closed break, and an all-API-failure loop all
            # leave VERDICT empty → fail closed here. A retained stale CONC can
            # never green the required gate.
            case "$VERDICT" in
              success)
                echo "real verdict for ${SHA} = success — gate green"
                exit 0 ;;
              "")
                echo "::error::no confirmed gate verdict for ${SHA} — never saw a fresh gate-verdict marker with no commit-path leaf in flight (the commit 'gate' run was cancelled / never ran / still queued, or the check-runs API was unreachable). Re-run the 'gate' workflow on this PR, or push a commit. Failing closed."
                exit 1 ;;
              *)
                echo "::error::real verdict for ${SHA} was '${VERDICT}' — echoing it. An edit never masks a real failure; fix the code and push a commit."
                exit 1 ;;
            esac
          fi
          # Commit / retarget / push: the real verdict is "did every leaf succeed".
          echo "$RESULTS"
          if echo "$RESULTS" | jq -e 'all(.[]; .result == "success")' >/dev/null; then
            MARK=success
          else
            MARK=failure
          fi
          # Record the verdict as a non-required marker on the head SHA so future
          # edit runs can echo it. Best-effort: on a fork-head PR GITHUB_TOKEN is
          # read-only regardless of `permissions:`, so this POST 403s — the gate
          # still reflects the real result below; only later EDIT runs on a fork
          # degrade (they fail closed, never mask). Same-repo branches — the
          # fleet's flow — always publish.
          if ! gh api "repos/$REPO/check-runs" -X POST -f name=gate-verdict \
                -f head_sha="$SHA" -f status=completed -f conclusion="$MARK" >/dev/null 2>&1; then
            echo "::warning::could not publish the gate-verdict marker for ${SHA} (read-only token / fork PR?) — edit runs on this commit will fail closed until a commit run can publish one."
          fi
          echo "real verdict = ${MARK}; recorded as gate-verdict marker for ${SHA}"
          # Make THIS job's conclusion the required verdict.
          if [ "$MARK" != success ]; then
            echo "::error::a required job did not succeed"
            exit 1
          fi
