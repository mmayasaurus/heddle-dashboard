# Deterministic Review — the NON-AI reviewer tier (ported from Spinventory's
# deterministic-review.yml, Maya-approved there 2026-07-13; heddle port is HED-12).
# Tauri/Rust + React desktop app (heddle-dashboard).
#
# Zero-flake scanners that catch what a rule engine catches every single time,
# complementing whatever AI reviewers Maya enables (HED-13):
#   semgrep   — registry rulesets p/typescript + p/react + p/rust. DIFF-AWARE on PRs
#               (--baseline-commit = the merge ref's first parent, i.e. the
#               base tip actually merged: only findings this PR introduces —
#               HED-80), FULL on pushes to main (so the Security tab holds
#               the whole picture, not just deltas). PR-controlled
#               suppressions (.semgrepignore, inline nosemgrep) are
#               neutralised — see the Scan step.
#   gitleaks  — secrets in exactly the PR's commit range (base.sha..head.sha),
#               values REDACTED. Runs the official gitleaks CLI image directly
#               rather than gitleaks-action: the action lists PR commits with
#               the API default per_page=30 and never paginates, so a PR with
#               >30 commits is silently PARTIALLY scanned — and it needs a
#               write token, which fork PRs never get. Push-to-main coverage is
#               GitHub's native secret scanning + push protection (enabled on
#               this repo 2026-08-15) — a second engine on the same pushes.
# Workflow hygiene (actionlint + zizmor) lives in actions-hygiene.yml, path-
# filtered to .github/ changes.
#
# Where findings show up — DIFFERENT PLUMBING from Spinventory, SAME DISCIPLINE:
# instead of a hand-rolled, sanitized PR-comment poster, results are uploaded
# as SARIF to GitHub code scanning (free on public repos): they render as the
# "Code scanning results / <tool>" check + inline annotations on the PR and in
# the repo's Security tab; each job also writes a one-line job summary. The PR
# sweep (review discipline doc, HED-16) must read code-scanning alerts + the
# checks tab, not only comments/reviews/threads.
#
# Fork PRs: the SCANS run for everyone (read-only token is enough — nothing
# here checks out untrusted code with secrets, and no PR-controlled string is
# expanded into a run: block); only the SARIF-upload steps, which need a write
# token, are skipped for forks — the log + job summary still carry the result.
#
# Posture: semgrep is REPORT-ONLY (the job never reds on findings; code
# scanning's own "check failure" threshold decides whether its check reds —
# repo default: errors only). gitleaks is BLOCKING-red on a hit (rotating the
# secret is the fix, not re-running CI) but NOT a required check.
#
# Hardening (zizmor-clean): every action hash-pinned + Dependabot-bumped;
# container images tag+digest-pinned (Dependabot does NOT track `container:`
# images or `docker://` uses — bump those by hand, see the notes at each one);
# workflow-level `permissions: {}`; checkout without persisted credentials;
# runners pinned to an Ubuntu series (ubuntu-24.04), not `-latest`.
name: Deterministic Review

on:
  pull_request:
    # `edited` is here for ONE reason: retargeting the PR's base branch moves
    # semgrep's baseline and gitleaks' commit range, so the scans must re-run.
    # `edited` also fires on title/body edits — those runs echo the head SHA's
    # last real scanner verdict instead of scanning or publishing `skipped`.
    types: [opened, reopened, synchronize, ready_for_review, edited]
  push:
    branches: [main]

permissions: {}

# TWO SLOTS (HED-131). Commit-driven events and base retargets take the `scan`
# slot, where newer work cancels stale work. Title/body edits take the `noop`
# slot with cancellation disabled: their verdict echoes must never cancel an
# in-flight real scan or one another.
concurrency:
  group: det-review-${{ github.event.pull_request.number || github.ref }}-${{ (github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '') && 'scan' || 'noop' }}
  cancel-in-progress: ${{ github.event_name != 'pull_request' || github.event.action != 'edited' || github.event.changes.base.ref.from != '' }}

jobs:
  semgrep-scan:
    name: semgrep scan (diff-aware on PRs · full on main)
    # Every push to main is scanned. PRs: skip drafts and Dependabot's own PRs
    # (Dependabot gets a read-only token that cannot upload SARIF — semgrep's
    # sample config skips them too); the guard is PR-only so a main push whose
    # actor happens to be dependabot is still scanned. Like gate.yml's leaf
    # jobs, title/body edits skip this leaf; base retargets run it because the
    # baseline moved.
    if: >-
      github.event_name == 'push' ||
      (github.event.pull_request.draft == false &&
       github.event.pull_request.user.login != 'dependabot[bot]' &&
       (github.event.action != 'edited' || github.event.changes.base.ref.from != ''))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning (same-repo only)
    container:
      # Semgrep's documented CI image (docs.semgrep.dev sample-ci-configs),
      # tag+digest-pinned. MANUAL BUMP (Dependabot ignores container images):
      # bump the tag, refresh the digest from Docker Hub, and expect newer
      # rules = new findings.
      image: semgrep/semgrep:1.173.0@sha256:67319956da3dcb58baf5b322899c15458e3963e7018a86aeeb5cd224e69cb77a
    steps:
      - name: Checkout (full history — the baseline commit must be present)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan
        env:
          # PR: diff-aware; the baseline is resolved in the script below from
          # the checked-out merge commit's FIRST PARENT (the exact base tip
          # GitHub merged), NOT from pull_request.base.sha — that value is
          # recorded on the PR object and does not refresh when main moves, so
          # a scan against it attributes main's newer findings to the PR
          # (heddle-dashboard#13 → HED-80). Push: empty → full scan.
          IS_PR: ${{ github.event_name == 'pull_request' && 'yes' || '' }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA_FALLBACK: ${{ github.event.pull_request.base.sha }}
        run: sh .github/scripts/semgrep-scan.sh

      - name: Upload SARIF to code scanning
        # Needs a write token — same-repo PRs and main pushes only; fork PRs
        # keep the scan result in the log + summary above.
        if: >-
          github.event_name == 'push' ||
          github.event.pull_request.head.repo.full_name == github.repository
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: ${{ runner.temp }}/semgrep.sarif
          category: semgrep

  semgrep:
    # Stable public check context. Commit paths publish the semgrep-scan result;
    # title/body edits echo the head SHA's last real semgrep verdict.
    name: semgrep (diff-aware on PRs · full on main)
    needs: [semgrep-scan]
    # Runs whenever semgrep-scan runs (push, or a non-draft non-Dependabot PR)
    # PLUS eligible title/body edits (to echo) — i.e. SKIPS exactly when
    # semgrep-scan skips (draft / Dependabot). Its skip predicate MUST stay
    # equivalent to semgrep-scan's `if` (change one, change both). `always()` is
    # LOAD-BEARING: without it, `needs: [semgrep-scan]` would SKIP this job when
    # the scan fails/cancels — masking a real failure as `skipped`. With it, an
    # eligible event always runs this job, which then publishes the real verdict
    # (success OR failure) from needs.<scan>.result.
    if: >-
      always() &&
      (github.event_name == 'push' ||
       (github.event_name == 'pull_request' &&
        github.event.pull_request.draft == false &&
        github.event.pull_request.user.login != 'dependabot[bot]'))
    runs-on: ubuntu-24.04
    # INVARIANT (HED-182), two rules that size this echo:
    #   (1) the loop's sleep-sum ≈24m50s > the leaf timeout (`semgrep-scan` = 15),
    #       so the echo cannot run out of polls while the scan legitimately runs.
    #   (2) timeout-minutes 30 > the sleeps + API/startup allowance, so a stuck
    #       echo exits via its fail-closed loop rather than as `timed_out` red.
    timeout-minutes: 30
    permissions:
      checks: write
    steps:
      - name: Verdict (commit) or echo (edit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_EDIT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' }}
          SCAN_RESULT: ${{ needs.semgrep-scan.result }}
        run: |
          set -eu
          if [ "$IS_EDIT" = "true" ]; then
            echo "edit event — echoing the last real verdict (semgrep-verdict marker) for $SHA"
            CONC=none; DRY=0; VERDICT=""
            # WAIT for this SHA's real verdict; never fail closed on a timer. A
            # premature red would land in a check-suite NEWER than the commit
            # run's own semgrep, and GitHub resolves a required check from the
            # newest SUITE, so it would block the PR until another edit superseded
            # it. The ONLY fail-closed trigger is the commit-path semgrep scan
            # being verifiably GONE — no leaf job in flight — with still no
            # marker, sustained past a startup grace. D2 leaves VERDICT empty
            # except at the accept-break, so loop exhaustion cannot green a
            # retained CONC. The loop's sleep-sum ≈24m50s exceeds the leaf timeout
            # (15), and the 30-minute job timeout exceeds the sleeps plus API
            # allowance. Poll fast for ~2 min, then back off to 30s.
            for i in $(seq 1 57); do
              if ! CR=$(gh api "repos/$REPO/commits/$SHA/check-runs?filter=all" --paginate --slurp 2>/dev/null); then
                echo "  could not read check runs for ${SHA}; scan liveness is unknown — retrying"
                # A failed read breaks the verifiably-gone proof: an outage cannot
                # prove the scan is gone, so restart the dry streak.
                DRY=0
                if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
                continue
              fi
              # D1: accept the latest marker only when it is at least as new as
              # the newest executed leaf. The != skipped guard is LOAD-BEARING:
              # title/body edits create newer skipped leaves; counting those would
              # read every marker stale and red bot edits. in_progress leaves have
              # null conclusions, so they still count for the four-state wait.
              CONC=$(printf '%s\n' "$CR" | jq -r '
                [.[].check_runs[]] as $all
                | ([$all[] | select((.name | test("^semgrep scan")) and .conclusion != "skipped") | .started_at] | max) as $leaf
                | ([$all[] | select(.name == "semgrep-verdict")] | sort_by(.started_at) | last) as $m
                | if $m == null or $leaf == null then "none"
                  elif $m.started_at >= $leaf then ($m.conclusion // "none")
                  else "none" end')
              INFLIGHT=$(printf '%s\n' "$CR" | jq -r '[.[].check_runs[]] | [ .[] | select((.name|test("^semgrep scan")) and .status!="completed") ] | length')
              # Four states: a marker is usable only after the matching scan is
              # gone; any in-flight scan resets the dry proof, with or without a
              # stale marker; only no-marker + no-inflight advances fail-closed.
              if [ "$CONC" != "none" ] && [ "$INFLIGHT" = "0" ]; then
                VERDICT="$CONC"; break
              fi
              if [ "$CONC" = "none" ] && [ "$INFLIGHT" = "0" ]; then
                DRY=$((DRY + 1))
              else
                DRY=0
              fi
              # Fail closed only when the scan is verifiably gone AND still no
              # marker, sustained a few polls past the 90s grace — this bridges
              # the brief gap between the leaf finishing and the commit-path
              # aggregator publishing the marker.
              if [ "$i" -gt 9 ] && [ "$DRY" -ge 6 ]; then
                echo "  semgrep scan is no longer in flight and no semgrep-verdict marker appeared — the commit aggregator did not publish (cancelled / never ran)."
                break
              fi
              if [ -z "${WAITED:-}" ]; then
                WAITED=1
                {
                  echo "### semgrep — waiting for the commit-path verdict on \`${SHA}\`"
                  echo "This edit run is holding \`semgrep\` **pending** until the commit-path scan for this commit publishes its \`semgrep-verdict\`, which the echo then reflects. Pending here means *blocked-while-scanning*, not failed."
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "  waiting for the commit run's verdict on ${SHA} (poll ${i}; marker=${CONC}, commit-path jobs in flight=${INFLIGHT}, dry=${DRY})"
              if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
            done
            # D2: only an accept-break records VERDICT; exhaustion, a dry break,
            # or API failures leave it empty and fail closed.
            case "$VERDICT" in
              success)
                echo "real verdict for ${SHA} = success — semgrep green"
                exit 0 ;;
              "")
                echo "::error::no confirmed semgrep verdict for ${SHA} — never saw a fresh semgrep-verdict marker with no commit-path scan in flight (the commit 'semgrep' run was cancelled / never ran / still queued, or the check-runs API was unreachable). Re-run 'Deterministic Review' on this PR, or push a commit. Failing closed."
                exit 1 ;;
              *)
                echo "::error::real verdict for ${SHA} was '${VERDICT}' — echoing it. An edit never masks a real failure; fix the code and push a commit."
                exit 1 ;;
            esac
          fi
          # Commit / retarget / push: the real verdict IS the leaf result.
          case "$SCAN_RESULT" in
            success) MARK=success ;;
            *)       MARK=failure ;;
          esac
          # Record the verdict as a non-required marker on the head SHA so future
          # edit runs can echo it. Best-effort: on a fork-head PR GITHUB_TOKEN is
          # read-only regardless of `permissions:`, so this POST 403s — the
          # aggregator still reflects the real result below; only later EDIT runs
          # on a fork degrade (they fail closed, never mask). Same-repo branches
          # always publish.
          if ! gh api "repos/$REPO/check-runs" -X POST -f name=semgrep-verdict \
                -f head_sha="$SHA" -f status=completed -f conclusion="$MARK" >/dev/null 2>&1; then
            echo "::warning::could not publish the semgrep-verdict marker for ${SHA} (read-only token / fork PR?) — edit runs on this commit will fail closed until a commit run can publish one."
          fi
          echo "real verdict = ${MARK} (semgrep-scan=${SCAN_RESULT}); recorded as semgrep-verdict marker for ${SHA}"
          # Make THIS job's conclusion the scanner verdict.
          [ "$MARK" = success ]

  gitleaks-scan:
    name: gitleaks scan (secrets in the PR's commits)
    # PRs only — drafts INCLUDED (a leaked secret does not wait for
    # ready_for_review); `edited` only when the base branch changed (the
    # scanned range moves). Push-to-main coverage is GitHub secret scanning.
    if: >-
      github.event_name == 'pull_request' &&
      (github.event.action != 'edited' || github.event.changes.base.ref.from != '')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning (same-repo only)
    container:
      # Official gitleaks image (alpine + git + gitleaks), tag+digest-pinned.
      # MANUAL BUMP (Dependabot ignores container images): bump the tag and
      # refresh the digest from Docker Hub.
      image: zricethezav/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
    steps:
      - name: Checkout (full history — the PR range must be present)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan the PR's commit range
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # POSIX sh (container job — see the semgrep step). Exit code 2 = leaks
        # found (job goes red); anything else non-zero = tool/infra error.
        # --redact keeps values out of logs AND out of the report; the report
        # is uploaded to code scanning below (rule/file/line only).
        #
        # FAIL-CLOSED (round-3/4 lesson): gitleaks exits 0 with "0 commits
        # scanned … no leaks found" when its internal `git log` fails — the
        # round-3 run did exactly that (dubious-ownership error in the
        # container) and went GREEN with an EMPTY scan. So the step computes
        # the expected non-merge commit count itself and refuses any run whose
        # log shows a git/tool error or a different scanned count.
        #
        # Suppressions are PR-CONTROLLED (.gitleaks.toml, .gitleaksignore,
        # inline `gitleaks:allow` comments) — a PR (or fork) that ships a
        # lenient config would otherwise scan itself green. So the scan always
        # uses the BASE branch's suppression files (a default-rules stub when
        # the base has none), never the PR's, and inline allow-comments are
        # ignored. Consequence: a suppression must land on main first (its own
        # config-only PR, reviewed by a human) before a PR can benefit from it.
        # A PR that touches those files is additionally flagged in the summary
        # (Spinventory det-tier finding, #2077).
        # Invoked via `sh` on purpose: the script sets its own `set -eu`, and
        # calling the interpreter explicitly means a lost exec bit (archive/checkout
        # quirks) cannot turn the security scan into a silent no-op (codacy).
        run: sh .github/scripts/gitleaks-range-scan.sh

      - name: Upload SARIF to code scanning
        # always(): the report matters MOST when the scan step just failed on
        # a hit. Same-repo only (write token); fork PRs keep the log verdict.
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: Upload merge-delta SARIF to code scanning
        # Separate category: these findings live in merge-only content
        # (conflict resolutions / automerge-synthesized bytes), which the
        # history scan structurally cannot report (HED-109).
        if: >-
          always() &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          hashFiles('gitleaks-delta.sarif') != ''
        uses: github/codeql-action/upload-sarif@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          sarif_file: gitleaks-delta.sarif
          category: gitleaks-merge-delta

  gitleaks:
    # Stable public check context. Commit paths publish the gitleaks-scan result;
    # title/body edits echo the head SHA's last real gitleaks verdict.
    name: gitleaks (secrets in the PR's commits)
    needs: [gitleaks-scan]
    # Runs on every PR event (drafts included — a leaked secret does not wait for
    # ready_for_review; edits included, to echo); SKIPS on push (gitleaks-scan is
    # PR-only — push coverage is native GitHub secret scanning). Its skip
    # predicate MUST stay equivalent to gitleaks-scan's `if`. `always()` is
    # LOAD-BEARING: without it, `needs: [gitleaks-scan]` would SKIP this job when
    # the scan FAILS (a secret hit) — masking the leak as `skipped`. With it, a PR
    # event always runs this job, which publishes the real verdict.
    if: >-
      always() && github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    # INVARIANT (HED-182), two rules that size this echo:
    #   (1) the loop's sleep-sum ≈24m50s > the leaf timeout (`gitleaks-scan` = 10),
    #       so the echo cannot run out of polls while the scan legitimately runs.
    #   (2) timeout-minutes 30 > the sleeps + API/startup allowance, so a stuck
    #       echo exits via its fail-closed loop rather than as `timed_out` red.
    timeout-minutes: 30
    permissions:
      checks: write
    steps:
      - name: Verdict (commit) or echo (edit)
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          IS_EDIT: ${{ github.event_name == 'pull_request' && github.event.action == 'edited' && github.event.changes.base.ref.from == '' }}
          SCAN_RESULT: ${{ needs.gitleaks-scan.result }}
        run: |
          set -eu
          if [ "$IS_EDIT" = "true" ]; then
            echo "edit event — echoing the last real verdict (gitleaks-verdict marker) for $SHA"
            CONC=none; DRY=0; VERDICT=""
            # WAIT for this SHA's real verdict; never fail closed on a timer. A
            # premature red would land in a check-suite NEWER than the commit
            # run's own gitleaks, and GitHub resolves a required check from the
            # newest SUITE, so it would block the PR until another edit superseded
            # it. The ONLY fail-closed trigger is the commit-path gitleaks scan
            # being verifiably GONE — no leaf job in flight — with still no
            # marker, sustained past a startup grace. D2 leaves VERDICT empty
            # except at the accept-break, so loop exhaustion cannot green a
            # retained CONC. The loop's sleep-sum ≈24m50s exceeds the leaf timeout
            # (10), and the 30-minute job timeout exceeds the sleeps plus API
            # allowance. Poll fast for ~2 min, then back off to 30s.
            for i in $(seq 1 57); do
              if ! CR=$(gh api "repos/$REPO/commits/$SHA/check-runs?filter=all" --paginate --slurp 2>/dev/null); then
                echo "  could not read check runs for ${SHA}; scan liveness is unknown — retrying"
                # A failed read breaks the verifiably-gone proof: an outage cannot
                # prove the scan is gone, so restart the dry streak.
                DRY=0
                if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
                continue
              fi
              # D1: accept the latest marker only when it is at least as new as
              # the newest executed leaf. The != skipped guard is LOAD-BEARING:
              # title/body edits create newer skipped leaves; counting those would
              # read every marker stale and red bot edits. in_progress leaves have
              # null conclusions, so they still count for the four-state wait.
              CONC=$(printf '%s\n' "$CR" | jq -r '
                [.[].check_runs[]] as $all
                | ([$all[] | select((.name | test("^gitleaks scan")) and .conclusion != "skipped") | .started_at] | max) as $leaf
                | ([$all[] | select(.name == "gitleaks-verdict")] | sort_by(.started_at) | last) as $m
                | if $m == null or $leaf == null then "none"
                  elif $m.started_at >= $leaf then ($m.conclusion // "none")
                  else "none" end')
              INFLIGHT=$(printf '%s\n' "$CR" | jq -r '[.[].check_runs[]] | [ .[] | select((.name|test("^gitleaks scan")) and .status!="completed") ] | length')
              # Four states: a marker is usable only after the matching scan is
              # gone; any in-flight scan resets the dry proof, with or without a
              # stale marker; only no-marker + no-inflight advances fail-closed.
              if [ "$CONC" != "none" ] && [ "$INFLIGHT" = "0" ]; then
                VERDICT="$CONC"; break
              fi
              if [ "$CONC" = "none" ] && [ "$INFLIGHT" = "0" ]; then
                DRY=$((DRY + 1))
              else
                DRY=0
              fi
              # Fail closed only when the scan is verifiably gone AND still no
              # marker, sustained a few polls past the 90s grace — this bridges
              # the brief gap between the leaf finishing and the commit-path
              # aggregator publishing the marker.
              if [ "$i" -gt 9 ] && [ "$DRY" -ge 6 ]; then
                echo "  gitleaks scan is no longer in flight and no gitleaks-verdict marker appeared — the commit aggregator did not publish (cancelled / never ran)."
                break
              fi
              if [ -z "${WAITED:-}" ]; then
                WAITED=1
                {
                  echo "### gitleaks — waiting for the commit-path verdict on \`${SHA}\`"
                  echo "This edit run is holding \`gitleaks\` **pending** until the commit-path scan for this commit publishes its \`gitleaks-verdict\`, which the echo then reflects. Pending here means *blocked-while-scanning*, not failed."
                } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
              fi
              echo "  waiting for the commit run's verdict on ${SHA} (poll ${i}; marker=${CONC}, commit-path jobs in flight=${INFLIGHT}, dry=${DRY})"
              if [ "$i" -lt 12 ]; then sleep 10; else sleep 30; fi
            done
            # D2: only an accept-break records VERDICT; exhaustion, a dry break,
            # or API failures leave it empty and fail closed.
            case "$VERDICT" in
              success)
                echo "real verdict for ${SHA} = success — gitleaks green"
                exit 0 ;;
              "")
                echo "::error::no confirmed gitleaks verdict for ${SHA} — never saw a fresh gitleaks-verdict marker with no commit-path scan in flight (the commit 'gitleaks' run was cancelled / never ran / still queued, or the check-runs API was unreachable). Re-run 'Deterministic Review' on this PR, or push a commit. Failing closed."
                exit 1 ;;
              *)
                echo "::error::real verdict for ${SHA} was '${VERDICT}' — echoing it. An edit never masks a real failure; fix the code and push a commit."
                exit 1 ;;
            esac
          fi
          # Commit / retarget / push: the real verdict IS the leaf result.
          case "$SCAN_RESULT" in
            success) MARK=success ;;
            *)       MARK=failure ;;
          esac
          # Record the verdict as a non-required marker on the head SHA so future
          # edit runs can echo it. Best-effort: on a fork-head PR GITHUB_TOKEN is
          # read-only regardless of `permissions:`, so this POST 403s — the
          # aggregator still reflects the real result below; only later EDIT runs
          # on a fork degrade (they fail closed, never mask). Same-repo branches
          # always publish.
          if ! gh api "repos/$REPO/check-runs" -X POST -f name=gitleaks-verdict \
                -f head_sha="$SHA" -f status=completed -f conclusion="$MARK" >/dev/null 2>&1; then
            echo "::warning::could not publish the gitleaks-verdict marker for ${SHA} (read-only token / fork PR?) — edit runs on this commit will fail closed until a commit run can publish one."
          fi
          echo "real verdict = ${MARK} (gitleaks-scan=${SCAN_RESULT}); recorded as gitleaks-verdict marker for ${SHA}"
          # Make THIS job's conclusion the scanner verdict.
          [ "$MARK" = success ]
