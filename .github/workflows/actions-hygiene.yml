# Workflow hygiene — actionlint + zizmor over .github/, only when a change
# touches it (path-filtered at the trigger; the deterministic tier's other
# scanners live in deterministic-review.yml). Part of HED-12.
#
#   actionlint — syntax / expression / shellcheck-style lint of workflow files.
#                Findings fail the job (they are real errors: an invalid
#                workflow file is a zero-job red ✗ on every future run).
#   zizmor     — Actions-specific security audit (template injection, unpinned
#                actions, excessive permissions, artipacked credentials …).
#                Findings upload as SARIF to code scanning (free on public repos)
#                and surface as the "Code scanning results / zizmor" check.
#
# Runs on the PR's own copy of the workflows, so a PR that edits CI audits
# itself. Both tools run for fork PRs too. zizmor's two modes differ in
# POSTURE, not just surface: same-repo PRs / main uploads SARIF and is
# report-only (blocking would come from a ruleset requiring the code-scanning
# check — not configured yet, HED-13); fork PRs run in plain mode, which
# prints findings and FAILS the job on them — a stricter default for the
# higher-risk case (workflow edits from outside).
name: Workflow Hygiene

on:
  pull_request:
    paths:
      - ".github/**"
  push:
    branches: [main]
    paths:
      - ".github/**"

permissions: {}

concurrency:
  group: actions-hygiene-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed scan-surface guard (HED-252, mirrors the semgrep volume guard,
      # HED-70): actionlint auto-discovers `.github/workflows/` and exits 0 with no
      # output when it finds nothing, so an empty checkout or a broken discovery reads
      # as a green pass. actionlint reports no scanned-file count (no JSON mode; -format
      # renders errors only), so assert the discovered surface is non-empty here — this
      # repo always has workflows, so 0 means the scan is empty, not clean.
      - name: Guard — non-empty scan surface
        run: |
          set -eu
          N=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | wc -l | tr -d ' ')
          if [ "$N" -eq 0 ]; then
            echo "::error::actions-hygiene: 0 workflow files under .github/workflows — the scan surface is empty (a green scan of nothing is not a pass). NOT a clean pass"
            exit 1
          fi
          echo "scan surface: $N workflow file(s) under .github/workflows"

      # rhysd/actionlint's documented Docker usage, version- AND digest-pinned
      # (the docs' `:latest` is a moving target). Digest = the multi-arch
      # manifest list for 1.7.12 on Docker Hub, resolved 2026-08-15.
      # MANUAL BUMP: Dependabot does not track `docker://` uses
      # (dependabot-core#8362) — bump tag + digest by hand.
      - name: actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color

      - name: shellcheck (.github/scripts — actionlint no longer sees this shell inline)
        run: |
          set -eu
          shellcheck --shell=sh .github/scripts/*.sh

  zizmor:
    name: zizmor
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write  # SARIF upload to code scanning (same-repo only)
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Fail-closed scan-surface guard (HED-252, mirrors the semgrep volume guard,
      # HED-70): zizmor auto-discovers `.github/` and exits 0 when it finds nothing,
      # so an empty checkout reads as a green pass. Neither the zizmor CLI (no --format
      # emits an audited-file count) nor zizmor-action (only a SARIF output) reports
      # scanned volume, so assert the workflow surface is non-empty — this repo always
      # has workflows, so 0 means the scan is empty, not clean.
      - name: Guard — non-empty scan surface
        run: |
          set -eu
          N=$(find .github/workflows -maxdepth 1 -type f \( -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | wc -l | tr -d ' ')
          if [ "$N" -eq 0 ]; then
            echo "::error::actions-hygiene: 0 workflow files under .github/workflows — the scan surface is empty (a green scan of nothing is not a pass). NOT a clean pass"
            exit 1
          fi
          echo "scan surface: $N workflow file(s) under .github/workflows"

      # zizmor's official action; defaults = persona regular, online audits on
      # (uses the job token for read-only GitHub API lookups). SARIF upload
      # (report-only) where the token can write — main pushes + same-repo PRs;
      # fork PRs run plain mode: findings print to the console and red the job.
      - name: zizmor
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: ${{ github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository }}
