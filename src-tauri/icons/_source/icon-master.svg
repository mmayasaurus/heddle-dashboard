<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 100 100" shape-rendering="geometricPrecision">
<!--
  VelaTerm icon master (vector original)
  - Source: velaterm-sail-dark-green.svg from ui/icons.zip
  - Change: the whole group is wrapped in translate(7.520) scale(0.849609), shrinking the
            originally full-bleed square to "artwork 870 / canvas 1024 ~= 85%, with a 77px
            transparent margin on each side".
            Note: 85% is a compromise between 80% (too small) and 90% (too large). macOS 15 and
            earlier draw it as-is and the margin is visible; macOS 26 normalises the size itself
            and ignores the margin.
  - Caution: the colours use oklch(), so they are only accurate in a renderer that supports oklch
            (a browser, or a recent resvg). The actual build uses icon-master-1024.png in this
            same directory, where the colours are already baked in and carry no risk.
-->
<defs>
  <linearGradient id="bg-sail-dark-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.255 0.013 260)"></stop><stop offset="1" stop-color="oklch(0.145 0.008 260)"></stop></linearGradient>
  <linearGradient id="gl-sail-dark-green" x1="0" y1="0" x2="0.25" y2="1"><stop offset="0" stop-color="oklch(0.86 0.15 158)"></stop><stop offset="1" stop-color="oklch(0.66 0.16 158)"></stop></linearGradient>
  <linearGradient id="glh-sail-dark-green" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="oklch(0.86 0.15 158)"></stop><stop offset="1" stop-color="oklch(0.78 0.15 158)"></stop></linearGradient>
</defs>
<g transform="translate(7.520 7.520) scale(0.849609)">
  <rect x="0" y="0" width="100" height="100" rx="23.5" fill="url(#bg-sail-dark-green)"></rect>
  <rect x="0.6" y="0.6" width="98.8" height="98.8" rx="22.9" fill="none" stroke="oklch(1 0 0 / 0.08)" stroke-width="1.2"></rect>
  <rect x="29.5" y="20" width="6" height="62" rx="3" fill="oklch(0.62 0.10 158)"></rect>
  <rect x="29.5" y="80" width="25" height="6.5" rx="3.25" fill="url(#glh-sail-dark-green)"></rect>
  <path d="M 40 24 Q 67 30 76 51 Q 65 70 40 74 Z" fill="url(#gl-sail-dark-green)"></path>
  <path d="M 40 49 Q 58 49 70 53" fill="none" stroke="oklch(0.16 0.01 260 / 0.35)" stroke-width="2.2" stroke-linecap="round"></path>
</g>
</svg>
